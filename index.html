

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lift Maintenance App</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
      color: #1e293b;
    }
    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 15px #0001;
    }
    h1 { color: #075985; font-size: 25px; }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      padding: 11px;
      margin-top: 6px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 15px;
    }
    button {
      margin-top: 20px;
      padding: 12px 18px;
      background: #0369a1;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    .note { color: #64748b; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Lift Maintenance & Inspection</h1>
    <p>Lift inspection and service report</p>

    <form id="liftForm">
      <label>Project Name</label>
      <input id="project" required
        placeholder="Enter project name">

      <label>Lift ID</label>
      <input id="liftId" required
        placeholder="Enter lift ID">

      <label>Lift Capacity (kg)</label>
      <input id="capacity" type="number" min="1"
        placeholder="e.g. 630">

      <label>Number of Floors</label>
      <input id="floors" type="number" min="1"
        placeholder="e.g. 10">

      <label>Inspection Date</label>
      <input id="date" type="date" required>

      <label>Inspection Status</label>
      <select id="status">
        <option>Pending</option>
        <option>In Progress</option>
        <option>Completed</option>
        <option>Requires Attention</option>
      </select>

      <label>Technical Remarks / Fault</label>
      <textarea id="remarks" rows="4"
        placeholder="Describe the issue or inspection findings"></textarea>

      <label>Corrective Action</label>
      <textarea id="action" rows="3"
        placeholder="Describe the action taken"></textarea>

      <button type="submit">Save Report</button>
    </form>

    <p id="message" role="status"></p>
    <p class="note">
      First version: form design only. Data storage will be
      added in the next step.
    </p>
  </div>

  <script>
    document.getElementById("liftForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();
        document.getElementById("message").textContent =
          "Form tested successfully! Next step: save reports.";
      });
  </script>
</body>
</html>
